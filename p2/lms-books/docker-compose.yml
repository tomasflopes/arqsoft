
services:
    lmsbooks_1:
        image: lmsbooks:latest
        container_name: books1_in_lms_network
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - "8087:8080"
        environment:
            SPRING_PROFILES_ACTIVE: instance1,bootstrap
            "spring.datasource.url": "jdbc:postgresql://books_db_1:5432/books_1"
            "spring.rabbitmq.host": "rabbitmq"
            "server.port": "8080"
        networks:
            - lms_network
            - lms_overlay_attachable_network
        volumes:
            - "uploaded_files_volume_1:/tmp"

    lmsbooks_2:
        image: lmsbooks:latest
        container_name: books2_in_lms_network
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - "8088:8080"
        environment:
            SPRING_PROFILES_ACTIVE: instance2,bootstrap
            "spring.datasource.url": "jdbc:postgresql://books_db_2:5432/books_2"
            "spring.rabbitmq.host": "rabbitmq"
            "server.port": "8080"
        networks:
            - lms_network
            - lms_overlay_attachable_network
        volumes:
            - "uploaded_files_volume_2:/tmp"

networks:
    lms_network:
        external: true
    lms_overlay_attachable_network:
        external: true

volumes:
    uploaded_files_volume_1:
    uploaded_files_volume_2: