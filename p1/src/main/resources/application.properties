spring.application.name=psoft-g1

##
## Profiles
##
##spring.profiles.active=bootstrap
spring.profiles.active=sql,bootstrap,openlibrary,googlebooks
app.id.strategy=base65

##
## OpenAPI
##
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

##
## JWT
##
jwt.private.key=classpath:rsa.private.key
jwt.public.key=classpath:rsa.public.key
google.books.api.base-url=https://www.googleapis.com/books


